<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Play FactionRush.io — Live Faction War</title>
  <meta name="description" content="Play FactionRush.io. Choose your faction, capture beacons, fight rivals, and deliver the Crown Relic.">
  <meta name="theme-color" content="#07101e">
  <link rel="canonical" href="https://factionrush.io/game.html">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>body{margin:0;background:#07101e;color:#f4f7ff;font-family:system-ui,sans-serif}#joinPanel{min-height:100vh;display:grid;place-items:center}.card{width:min(460px,calc(100vw - 32px));padding:30px;border:1px solid #ffffff24;border-radius:22px;background:#0a1120e0;text-align:center}input,button{font:inherit}input{width:100%;padding:14px;box-sizing:border-box;background:#0a1425;color:#fff;border:1px solid #ffffff24;border-radius:12px;margin-bottom:12px}button{padding:13px 18px;border:0;border-radius:12px;background:#385cff;color:#fff;font-weight:800}.factions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}.factions button{opacity:.65}.factions button.selected{opacity:1;outline:3px solid white}canvas{display:block;width:100vw;height:100vh}#game,#hud,#mobileControls{display:none}</style>
</head>
<body>
  <div id="joinPanel"><div class="card"><h1>FactionRush</h1><p>Capture territory, steal the Crown Relic, and make your faction famous.</p><input id="nameInput" maxlength="18" placeholder="Your battle name" autocomplete="off"><div class="factions"><button data-faction="0">Ember</button><button data-faction="1">Tide</button><button data-faction="2">Moss</button></div><button id="playButton">JOIN THE RUSH</button></div></div>
  <canvas id="game"></canvas><div id="hud"><div id="identity"></div><div id="roundInfo"></div><div id="resources"></div><div id="leaderboard"></div><div id="status"></div></div><div id="mobileControls"><div id="joystick"></div><button id="dashButton">DASH</button></div>
  <script src="/game.js"></script>
</body>
</html>
